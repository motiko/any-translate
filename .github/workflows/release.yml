name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
      - name: Check tag matches package.json version
        run: |
          version=$(node -p 'require("./package.json").version')
          if [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi
      - run: yarn install --frozen-lockfile
      - run: yarn build
      - run: yarn zip
      - run: mv pack.zip "any-translate-$GITHUB_REF_NAME.zip"
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "any-translate-$GITHUB_REF_NAME.zip" --title "$GITHUB_REF_NAME" --generate-notes
